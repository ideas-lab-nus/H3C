[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "h3c"
version = "0.1.0"
description = "Causality-constrained hierarchical LLM agents for online HVAC rule adaptation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Weilin Xin" },
  { name = "Wei Liang" },
  { name = "Adrian Chong" },
]
dependencies = ["pythermalcomfort>=3.6,<4"]

[project.urls]
Repository = "https://github.com/ideas-lab-nus/H3C"
Documentation = "https://github.com/ideas-lab-nus/H3C#readme"
Issues = "https://github.com/ideas-lab-nus/H3C/issues"

[project.scripts]
h3c = "h3c.cli:main"
h3c-baseline = "h3c_baselines.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]
offline = [
  "agent-framework-core==1.15.0",
  "agent-framework-openai==1.14.0",
]
baselines = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "torch==2.9.0",
  "stable-baselines3==2.7.0",
  "gymnasium==1.2.1",
  "matplotlib==3.10.7",
  "osqp==1.1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/h3c", "src/h3c_baselines"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["h3c", "h3c_baselines"]
